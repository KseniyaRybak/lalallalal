<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансовый дашборд | Леверидж и рентабельность</title>
    <!-- Tailwind CSS + Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Recharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.0/umd/Recharts.min.js"></script>
    <!-- React & ReactDOM -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100">
    <div id="root" class="container mx-auto px-4 py-8 max-w-7xl"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { BarChart, Bar, PieChart, Pie, Cell, XAxis, YAxis, Tooltip, Legend, ResponsiveContainer, CartesianGrid, LineChart, Line } = Recharts;

        // Исходные данные (из задачи)
        const initialData = {
            revenue: 2000,           // выручка
            variableCosts: 1050,     // переменные затраты
            fixedCosts: 300,         // постоянные затраты
            equity: 600,             // собственные средства
            longTermLoans: 150,      // долгосрочные кредиты
            shortTermLoans: 60,      // краткосрочные кредиты
            interestRate: 0.20,      // ставка по кредитам
            taxRate: 0.25            // налог
        };

        // Функция расчета всех метрик
        const calculateMetrics = (data) => {
            const revenue = data.revenue;
            const variableCosts = data.variableCosts;
            const fixedCosts = data.fixedCosts;
            const equity = data.equity;
            const totalLoans = data.longTermLoans + data.shortTermLoans;
            const interestExpense = totalLoans * data.interestRate;
            const taxRate = data.taxRate;

            const contributionMargin = revenue - variableCosts;          // маржинальная прибыль
            const ebit = contributionMargin - fixedCosts;                // операционная прибыль
            const taxableProfit = ebit - interestExpense;                // налогооблагаемая прибыль
            const tax = taxableProfit * taxRate;
            const netProfit = taxableProfit - tax;                       // чистая прибыль
            const totalAssets = equity + totalLoans;                     // активы
            const roa = (netProfit / totalAssets) * 100;                 // рентабельность активов (%)
            const roe = (netProfit / equity) * 100;                      // рентабельность собственного капитала (%)
            const dol = contributionMargin / ebit;                       // производственный леверидж
            const dfl = ebit / (ebit - interestExpense);                 // финансовый леверидж
            const dtl = dol * dfl;                                       // производственно-финансовый леверидж

            return {
                revenue, variableCosts, fixedCosts, equity, totalLoans, interestExpense,
                contributionMargin, ebit, taxableProfit, tax, netProfit, totalAssets, roa, roe,
                dol, dfl, dtl, taxRate: taxRate * 100
            };
        };

        // Главный компонент
        const Dashboard = () => {
            const [formData, setFormData] = useState(initialData);
            const [metrics, setMetrics] = useState(calculateMetrics(initialData));
            const [activeChart, setActiveChart] = useState('leverage');

            // Пересчет при изменении данных
            useEffect(() => {
                setMetrics(calculateMetrics(formData));
            }, [formData]);

            // Обработчик изменения полей
            const handleChange = (field, value) => {
                let numValue = parseFloat(value);
                if (isNaN(numValue)) numValue = 0;
                if (field === 'interestRate' || field === 'taxRate') {
                    numValue = Math.min(1, Math.max(0, numValue / 100));
                    setFormData(prev => ({ ...prev, [field]: numValue }));
                } else {
                    setFormData(prev => ({ ...prev, [field]: numValue }));
                }
            };

            // Форматирование чисел
            const formatMoney = (val) => val.toLocaleString('ru-RU') + ' тыс. руб.';
            const formatPercent = (val) => val.toFixed(2) + '%';
            const formatNumber = (val) => val.toFixed(2);

            // Данные для круговой диаграммы затрат
            const costPieData = [
                { name: 'Переменные затраты', value: metrics.variableCosts, color: '#FF6B6B' },
                { name: 'Постоянные затраты', value: metrics.fixedCosts, color: '#4ECDC4' },
                { name: 'Налоги и проценты', value: metrics.tax + metrics.interestExpense, color: '#45B7D1' },
                { name: 'Чистая прибыль', value: metrics.netProfit, color: '#96CEB4' }
            ].filter(item => item.value > 0);

            // Данные для столбчатой диаграммы левериджа
            const leverageData = [
                { name: 'Производственный (DOL)', value: metrics.dol, fill: '#FF6B6B' },
                { name: 'Финансовый (DFL)', value: metrics.dfl, fill: '#4ECDC4' },
                { name: 'Общий (DTL)', value: metrics.dtl, fill: '#45B7D1' }
            ];

            return (
                <div>
                    {/* Заголовок */}
                    <div className="mb-8 text-center">
                        <h1 className="text-4xl font-bold bg-gradient-to-r from-slate-800 to-slate-600 bg-clip-text text-transparent mb-2">
                            Финансовый аналитический дашборд
                        </h1>
                        <p className="text-slate-500">Расчёт левериджа, рентабельности и ключевых метрик</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Левая колонка — форма ввода */}
                        <div className="lg:col-span-1 bg-white rounded-2xl shadow-lg p-6 card-hover">
                            <h2 className="text-xl font-semibold text-slate-800 mb-4 flex items-center gap-2">
                                <span className="w-2 h-2 bg-blue-500 rounded-full"></span>
                                Входные параметры
                            </h2>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-1">Выручка (тыс. руб.)</label>
                                    <input type="number" value={formData.revenue} onChange={(e) => handleChange('revenue', e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-transparent" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-1">Переменные затраты (тыс. руб.)</label>
                                    <input type="number" value={formData.variableCosts} onChange={(e) => handleChange('variableCosts', e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-1">Постоянные затраты (тыс. руб.)</label>
                                    <input type="number" value={formData.fixedCosts} onChange={(e) => handleChange('fixedCosts', e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-1">Собственные средства (тыс. руб.)</label>
                                    <input type="number" value={formData.equity} onChange={(e) => handleChange('equity', e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-1">Долгосрочные кредиты (тыс. руб.)</label>
                                    <input type="number" value={formData.longTermLoans} onChange={(e) => handleChange('longTermLoans', e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-1">Краткосрочные кредиты (тыс. руб.)</label>
                                    <input type="number" value={formData.shortTermLoans} onChange={(e) => handleChange('shortTermLoans', e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-1">Процентная ставка по кредитам (%)</label>
                                    <input type="number" step="0.1" value={formData.interestRate * 100} onChange={(e) => handleChange('interestRate', e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-1">Ставка налогообложения (%)</label>
                                    <input type="number" step="0.1" value={formData.taxRate * 100} onChange={(e) => handleChange('taxRate', e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg" />
                                </div>
                            </div>
                        </div>

                        {/* Правая колонка — метрики и графики */}
                        <div className="lg:col-span-2 space-y-6">
                            {/* Карточки ключевых показателей */}
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                <div className="bg-white rounded-xl shadow-md p-4 card-hover border-l-4 border-blue-500">
                                    <p className="text-slate-500 text-sm">Чистая прибыль</p>
                                    <p className="text-2xl font-bold text-slate-800">{formatMoney(metrics.netProfit)}</p>
                                </div>
                                <div className="bg-white rounded-xl shadow-md p-4 card-hover border-l-4 border-emerald-500">
                                    <p className="text-slate-500 text-sm">Рентабельность активов (ROA)</p>
                                    <p className="text-2xl font-bold text-emerald-600">{formatPercent(metrics.roa)}</p>
                                </div>
                                <div className="bg-white rounded-xl shadow-md p-4 card-hover border-l-4 border-violet-500">
                                    <p className="text-slate-500 text-sm">Рентабельность СК (ROE)</p>
                                    <p className="text-2xl font-bold text-violet-600">{formatPercent(metrics.roe)}</p>
                                </div>
                                <div className="bg-white rounded-xl shadow-md p-4 card-hover border-l-4 border-amber-500">
                                    <p className="text-slate-500 text-sm">EBIT (операционная прибыль)</p>
                                    <p className="text-2xl font-bold text-amber-600">{formatMoney(metrics.ebit)}</p>
                                </div>
                                <div className="bg-white rounded-xl shadow-md p-4 card-hover border-l-4 border-rose-500">
                                    <p className="text-slate-500 text-sm">Общий леверидж (DTL)</p>
                                    <p className="text-2xl font-bold text-rose-600">{formatNumber(metrics.dtl)}</p>
                                </div>
                                <div className="bg-white rounded-xl shadow-md p-4 card-hover border-l-4 border-indigo-500">
                                    <p className="text-slate-500 text-sm">Активы</p>
                                    <p className="text-2xl font-bold text-indigo-600">{formatMoney(metrics.totalAssets)}</p>
                                </div>
                            </div>

                            <!-- Переключатель графиков -->
                            <div className="bg-white rounded-2xl shadow-lg p-6">
                                <div className="flex gap-3 mb-4 border-b border-slate-200 pb-2">
                                    <button onClick={() => setActiveChart('leverage')} className={`px-4 py-2 rounded-lg transition ${activeChart === 'leverage' ? 'bg-blue-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Леверидж</button>
                                    <button onClick={() => setActiveChart('cost')} className={`px-4 py-2 rounded-lg transition ${activeChart === 'cost' ? 'bg-blue-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Структура затрат</button>
                                    <button onClick={() => setActiveChart('profitability')} className={`px-4 py-2 rounded-lg transition ${activeChart === 'profitability' ? 'bg-blue-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Рентабельность</button>
                                </div>

                                <div className="h-80">
                                    {activeChart === 'leverage' && (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={leverageData}>
                                                <CartesianGrid strokeDasharray="3 3" />
                                                <XAxis dataKey="name" />
                                                <YAxis domain={[0, 'auto']} />
                                                <Tooltip formatter={(value) => formatNumber(value)} />
                                                <Legend />
                                                <Bar dataKey="value" name="Значение">
                                                    {leverageData.map((entry, index) => (<Cell key={`cell-${index}`} fill={entry.fill} />))}
                                                </Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    )}
                                    {activeChart === 'cost' && (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={costPieData} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={100} label>
                                                    {costPieData.map((entry, index) => (<Cell key={`cell-${index}`} fill={entry.color} />))}
                                                </Pie>
                                                <Tooltip formatter={(value) => formatMoney(value)} />
                                                <Legend />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    )}
                                    {activeChart === 'profitability' && (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={[{ name: 'ROA', value: metrics.roa }, { name: 'ROE', value: metrics.roe }]}>
                                                <CartesianGrid strokeDasharray="3 3" />
                                                <XAxis dataKey="name" />
                                                <YAxis unit="%" />
                                                <Tooltip formatter={(value) => formatPercent(value)} />
                                                <Bar dataKey="value" fill="#45B7D1" />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    )}
                                </div>
                            </div>

                            {/* Таблица расшифровки */}
                            <div className="bg-white rounded-2xl shadow-lg p-6">
                                <h3 className="text-lg font-semibold text-slate-700 mb-3">Детальный расчёт показателей</h3>
                                <div className="overflow-x-auto">
                                    <table className="min-w-full text-sm">
                                        <tbody className="divide-y divide-slate-200">
                                            <tr><td className="py-2 font-medium">Маржинальная прибыль</td><td className="text-right">{formatMoney(metrics.contributionMargin)}</td></tr>
                                            <tr><td className="py-2 font-medium">Проценты по кредитам</td><td className="text-right">{formatMoney(metrics.interestExpense)}</td></tr>
                                            <tr><td className="py-2 font-medium">Налогооблагаемая прибыль</td><td className="text-right">{formatMoney(metrics.taxableProfit)}</td></tr>
                                            <tr><td className="py-2 font-medium">Налог (ставка {metrics.taxRate}%)</td><td className="text-right">{formatMoney(metrics.tax)}</td></tr>
                                            <tr className="bg-slate-50"><td className="py-2 font-bold">Производственный леверидж (DOL)</td><td className="text-right font-bold">{formatNumber(metrics.dol)}</td></tr>
                                            <tr className="bg-slate-50"><td className="py-2 font-bold">Финансовый леверидж (DFL)</td><td className="text-right font-bold">{formatNumber(metrics.dfl)}</td></tr>
                                            <tr className="bg-slate-50"><td className="py-2 font-bold">Производственно-финансовый леверидж (DTL)</td><td className="text-right font-bold">{formatNumber(metrics.dtl)}</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
